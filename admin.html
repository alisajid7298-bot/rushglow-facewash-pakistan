<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rush Glow Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f8f6;color:#163b35}.wrap{max-width:900px;margin:auto;padding:25px}.panel,.item{background:white;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input,textarea,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd9d5;border-radius:9px}button{background:#08796b;color:white;border:0;font-weight:bold}.del{background:#b52d2d;width:auto}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center}.item img{width:90px;height:90px;object-fit:contain}</style></head><body><div class="wrap"><h1>Rush Glow Admin</h1><div class="panel"><h2>Add New Product</h2><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><textarea id="desc" placeholder="Description"></textarea><input id="photo" type="file" accept="image/*"><button id="saveBtn" type="button">Save Product Online</button><p id="msg"></p></div><div class="panel"><h2>Order Controller</h2><button type="button" onclick="loadOrders()">Refresh Orders</button><div id="ordersList">Loading orders...</div></div><h2>Online Products</h2><div id="list">Loading...</div></div><script>
const nameEl=document.getElementById('name'),priceEl=document.getElementById('price'),descEl=document.getElementById('desc'),photoEl=document.getElementById('photo'),msgEl=document.getElementById('msg'),listEl=document.getElementById('list'),saveBtn=document.getElementById('saveBtn');
let photoData='';photoEl.onchange=()=>{const f=photoEl.files[0];if(!f)return;const im=new Image(),r=new FileReader();r.onload=x=>{im.onload=()=>{const c=document.createElement('canvas'),m=650,s=Math.min(1,m/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.62)};im.src=x.target.result};r.readAsDataURL(f)};async function saveProduct(){
msgEl.textContent='Preparing...'; saveBtn.disabled=true;
try{
 if(photoEl.files[0]&&!photoData){await new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{n++;if(photoData){clearInterval(t);resolve()}if(n>60){clearInterval(t);reject(new Error('Photo processing failed'))}},100)})}
 const b={name:nameEl.value.trim(),price:priceEl.value.trim(),description:descEl.value.trim(),photo:photoData};
 if(!b.name)throw new Error('Product name required');
 msgEl.textContent='Saving online...';
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:controller.signal});clearTimeout(timeout);
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
 msgEl.textContent='Saved online ✓';nameEl.value='';priceEl.value='';descEl.value='';photoEl.value='';photoData='';await load();
}catch(e){msgEl.textContent='Save failed: '+(e.name==='AbortError'?'server timeout':e.message)}
finally{saveBtn.disabled=false}
}
saveBtn.addEventListener('click',saveProduct);
async function del(id){if(confirm('Delete product?')){await fetch('/api/products?id='+id,{method:'DELETE'});load()}}async function load(){const r=await fetch('/api/products');if(!r.ok){listEl.innerHTML='Database error';return}const a=await r.json();listEl.innerHTML=a.length?a.map(p=>'<div class="item">'+(p.photo?'<img src="'+p.photo+'">':'<div></div>')+'<div><b>'+p.name+'</b><br>Rs. '+(p.price||'')+'<br><small>'+(p.description||'')+'</small></div><button class="del" onclick="del(\''+p.id+'\')">Delete</button></div>').join(''):'No products yet.'}load();async function loadOrders(){try{const r=await fetch('/api/orders');const a=await r.json();document.getElementById('ordersList').innerHTML=a.length?a.map(o=>'<div style="border-bottom:1px solid #ddd;padding:14px 0"><b>Order #'+o.id+' — '+(o.status||'Pending')+'</b><br>'+String(o.product_name||'')+' | Rs. '+String(o.price||'')+'<br>'+String(o.customer_name||'')+' — '+String(o.phone||'')+'<br><select onchange="setStatus('+o.id+',this.value)" style="padding:8px;margin-top:8px"><option '+(o.status==='Pending'?'selected':'')+'>Pending</option><option '+(o.status==='Paid'?'selected':'')+'>Paid</option><option '+(o.status==='Packed'?'selected':'')+'>Packed</option><option '+(o.status==='Shipped'?'selected':'')+'>Shipped</option><option '+(o.status==='Delivery Complete'?'selected':'')+'>Delivery Complete</option></select></div>').join(''):'No orders yet.'}catch(e){document.getElementById('ordersList').innerHTML='Orders load nahi huay.'}}async function setStatus(id,status){const r=await fetch('/api/orders',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(r.ok)loadOrders();else alert('Status update failed')}loadOrders();</script></body></html>
