<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rush Glow Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f8f6;color:#163b35}.wrap{max-width:900px;margin:auto;padding:25px}.panel,.item{background:white;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input,textarea,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd9d5;border-radius:9px}button{background:#08796b;color:white;border:0;font-weight:bold}.del{background:#b52d2d;width:auto}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center}.item img{width:90px;height:90px;object-fit:contain}</style></head><body><div class="wrap"><h1>Rush Glow Admin</h1><div class="panel"><h2>Add New Product</h2><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><textarea id="desc" placeholder="Description"></textarea><input id="photo" type="file" accept="image/*"><button onclick="save()">Save Product Online</button><p id="msg"></p></div><h2>Online Products</h2><div id="list">Loading...</div></div><script>let photoData='';photo.onchange=()=>{const f=photo.files[0];if(!f)return;const im=new Image(),r=new FileReader();r.onload=x=>{im.onload=()=>{const c=document.createElement('canvas'),m=650,s=Math.min(1,m/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.62)};im.src=x.target.result};r.readAsDataURL(f)};async function save(){msg.textContent='Preparing photo...';if(photo.files[0]&&!photoData){await new Promise(resolve=>{const t=setInterval(()=>{if(photoData){clearInterval(t);resolve()}},100);setTimeout(()=>{clearInterval(t);resolve()},5000)})}msg.textContent='Saving...';const b={name:name.value.trim(),price:price.value.trim(),description:desc.value.trim(),photo:photoData};if(!b.name){msg.textContent='Product name likhein';return}try{const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok){msg.textContent='Saved online ✓';name.value=price.value=desc.value='';photo.value='';photoData='';load()}else{const x=await r.json().catch(()=>({}));msg.textContent='Save failed: '+(x.error||r.status)}}catch(e){msg.textContent='Save failed: network error'}}async function del(id){if(confirm('Delete product?')){await fetch('/api/products?id='+id,{method:'DELETE'});load()}}async function load(){const r=await fetch('/api/products');if(!r.ok){list.innerHTML='Database error';return}const a=await r.json();list.innerHTML=a.length?a.map(p=>'<div class="item">'+(p.photo?'<img src="'+p.photo+'">':'<div></div>')+'<div><b>'+p.name+'</b><br>Rs. '+(p.price||'')+'<br><small>'+(p.description||'')+'</small></div><button class="del" onclick="del(\''+p.id+'\')">Delete</button></div>').join(''):'No products yet.'}load();</script></body></html>
