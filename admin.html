<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rush Glow Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f8f6;color:#163b35}.wrap{max-width:900px;margin:auto;padding:25px}.panel,.item{background:white;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input,textarea,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd9d5;border-radius:9px}button{background:#08796b;color:white;border:0;font-weight:bold}.del{background:#b52d2d;width:auto}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center}.item img{width:90px;height:90px;object-fit:contain}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;padding:16px;border-radius:14px;box-shadow:0 5px 20px #0001;text-align:center}.stat b{display:block;font-size:24px;color:#08796b}.orderCard{background:#fff;border:1px solid #e0ebe7;border-radius:12px;padding:15px;margin:10px 0}.orderActions{display:flex;gap:8px;flex-wrap:wrap}.orderActions button,.orderActions select{width:auto;padding:9px}.edit{background:#b78925;width:auto}.shot{max-width:150px;max-height:150px}.badge{font-weight:bold;color:#08796b}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:70px 1fr}.item button{margin-right:5px}}</style></head><body><div class="wrap"><h1>Rush Glow Admin</h1><div class="panel"><h2>Add New Product</h2><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><textarea id="desc" placeholder="Description"></textarea><input id="photo" type="file" accept="image/*"><button id="saveBtn" type="button">Save Product Online</button><p id="msg"></p></div><div class="stats"><div class="stat"><b id="sTotal">0</b>Total Orders</div><div class="stat"><b id="sPending">0</b>Pending</div><div class="stat"><b id="sPaid">0</b>Paid</div><div class="stat"><b id="sShipped">0</b>Shipped</div><div class="stat"><b id="sDone">0</b>Completed</div></div><div class="panel"><h2>Order Controller</h2><button type="button" onclick="loadOrders()">Refresh Orders</button><div id="ordersList">Loading orders...</div></div><h2>Online Products</h2><div id="list">Loading...</div></div><script>
const nameEl=document.getElementById('name'),priceEl=document.getElementById('price'),descEl=document.getElementById('desc'),photoEl=document.getElementById('photo'),msgEl=document.getElementById('msg'),listEl=document.getElementById('list'),saveBtn=document.getElementById('saveBtn');
let photoData='';photoEl.onchange=()=>{const f=photoEl.files[0];if(!f)return;const im=new Image(),r=new FileReader();r.onload=x=>{im.onload=()=>{const c=document.createElement('canvas'),m=650,s=Math.min(1,m/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.62)};im.src=x.target.result};r.readAsDataURL(f)};async function saveProduct(){
msgEl.textContent='Preparing...'; saveBtn.disabled=true;
try{
 if(photoEl.files[0]&&!photoData){await new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{n++;if(photoData){clearInterval(t);resolve()}if(n>60){clearInterval(t);reject(new Error('Photo processing failed'))}},100)})}
 const b={name:nameEl.value.trim(),price:priceEl.value.trim(),description:descEl.value.trim(),photo:photoData};
 if(!b.name)throw new Error('Product name required');
 msgEl.textContent='Saving online...';
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:controller.signal});clearTimeout(timeout);
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
 msgEl.textContent='Saved online ✓';nameEl.value='';priceEl.value='';descEl.value='';photoEl.value='';photoData='';await load();
}catch(e){msgEl.textContent='Save failed: '+(e.name==='AbortError'?'server timeout':e.message)}
finally{saveBtn.disabled=false}
}
saveBtn.addEventListener('click',saveProduct);
async function del(id){if(confirm('Delete product?')){await fetch('/api/products?id='+id,{method:'DELETE'});load()}}async function load(){const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok){listEl.innerHTML='Database error';return}const a=await r.json();listEl.innerHTML=a.length?a.map(p=>'<div class="item">'+(p.photo?'<img src="'+p.photo+'">':'<div></div>')+'<div><b>'+p.name+'</b><br>Rs. '+(p.price||'')+'<br><small>'+(p.description||'')+'</small></div><button class="del" onclick="del(\''+p.id+'\')">Delete</button></div>').join(''):'No products yet.'}load();let allOrders=[];async function loadOrders(){try{const r=await fetch('/api/orders',{cache:'no-store'});allOrders=await r.json();sTotal.textContent=allOrders.length;sPending.textContent=allOrders.filter(x=>(x.status||'Pending')==='Pending').length;sPaid.textContent=allOrders.filter(x=>x.status==='Paid').length;sShipped.textContent=allOrders.filter(x=>x.status==='Shipped').length;sDone.textContent=allOrders.filter(x=>x.status==='Delivery Complete').length;ordersList.innerHTML=allOrders.length?allOrders.map(o=>'<div class="orderCard"><b>Order #'+o.id+'</b> <span class="badge">'+(o.status||'Pending')+'</span><br><b>'+esc(o.product_name)+'</b> | Rs. '+esc(o.price)+'<br><b>'+esc(o.customer_name)+'</b> — '+esc(o.phone)+(o.alternate_phone?' / '+esc(o.alternate_phone):'')+'<br>'+esc(o.address)+', '+esc(o.city)+'<br>Payment: '+esc(o.payment_method||'')+(o.transaction_id?' | Txn: '+esc(o.transaction_id):'')+(o.notes?'<br>Notes: '+esc(o.notes):'')+(o.payment_screenshot?'<br><img class="shot" src="'+o.payment_screenshot+'">':'')+'<div class="orderActions"><select onchange="setStatus('+o.id+',this.value)"><option '+sel(o,'Pending')+'>Pending</option><option '+sel(o,'Paid')+'>Paid</option><option '+sel(o,'Packed')+'>Packed</option><option '+sel(o,'Shipped')+'>Shipped</option><option '+sel(o,'Delivery Complete')+'>Delivery Complete</option></select><button onclick="window.open(\'https://wa.me/92'+String(o.phone||'').replace(/\D/g,'').replace(/^92/,'')+'?text='+encodeURIComponent('Rush Glow Order #'+o.id+' status: '+(o.status||'Pending'))+'\',\'_blank\')">WhatsApp Customer</button><button onclick="printOrder('+o.id+')">Print Order</button></div></div>').join(''):'No orders yet.'}catch(e){ordersList.innerHTML='Orders load nahi huay. Refresh karein.'}}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function sel(o,s){return (o.status||'Pending')===s?'selected':''}async function setStatus(id,status){const r=await fetch('/api/orders',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(r.ok)loadOrders();else alert('Status update failed')}function printOrder(id){const o=allOrders.find(x=>String(x.id)===String(id));if(!o)return;const w=window.open('','_blank');w.document.write('<h2>Rush Glow Order #'+o.id+'</h2><p>Customer: '+esc(o.customer_name)+'<br>Phone: '+esc(o.phone)+'<br>Address: '+esc(o.address)+', '+esc(o.city)+'<br>Product: '+esc(o.product_name)+'<br>Total: Rs. '+esc(o.price)+'<br>Payment: '+esc(o.payment_method)+'<br>Status: '+esc(o.status||'Pending')+'</p>');w.print()}async function editProduct(id){const r=await fetch('/api/products'),a=await r.json(),p=a.find(x=>String(x.id)===String(id));if(!p)return;const n=prompt('Product name',p.name);if(n===null)return;const pr=prompt('Price',p.price||'');if(pr===null)return;const d=prompt('Description',p.description||'');if(d===null)return;const x=await fetch('/api/products',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:n,price:pr,description:d,photo:''})});if(x.ok)load();else alert('Edit failed')}loadOrders();else alert('Status update failed')}loadOrders();</script></body></html>
